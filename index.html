<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#edf7f2">
  <title>Cannabis & Co. · Portafolio Médico 2026</title>
  <style>
    :root{
      --bg:#edf7f2; --paper:#ffffff; --ink:#173e34; --muted:#688278;
      --line:#d9e9e2; --bar:#f8fcfa;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{
      position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
      min-height:58px;padding:10px 18px;background:rgba(248,252,250,.96);
      border-bottom:1px solid var(--line);backdrop-filter:blur(10px)
    }
    .brand{font-size:14px;font-weight:800;letter-spacing:.035em}
    .meta{font-size:12px;color:var(--muted)}
    main{padding:24px 12px 48px}
    .page{
      max-width:1180px;margin:0 auto 24px;background:var(--paper);
      box-shadow:0 18px 55px rgba(23,62,52,.11);overflow:hidden
    }
    canvas{display:block;width:100%;height:auto}
    #status{text-align:center;padding:70px 20px;color:var(--muted)}
    @media(max-width:700px){
      header{padding:9px 12px;min-height:50px}
      .meta{display:none}
      main{padding:10px 4px 28px}
      .page{margin-bottom:10px}
    }
    @media print{body{display:none!important}}
  </style>
</head>
<body>
<header>
  <div class="brand">CANNABIS & CO. · PORTAFOLIO MÉDICO</div>
  <div class="meta">Catálogo 2026 · Visualización profesional</div>
</header>

<main id="catalog"><div id="status">Cargando catálogo…</div></main>

<script type="module">
  import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
  pdfjsLib.GlobalWorkerOptions.workerSrc=
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

  const pdfUrl="./Cannabis_Co_Portafolio_Medico_2026_LOGO_ORIGINAL_CLEAN.pdf";
  const catalog=document.getElementById("catalog");
  const status=document.getElementById("status");

  async function renderCatalog(){
    const pdf=await pdfjsLib.getDocument(pdfUrl).promise;
    status.remove();

    for(let n=1;n<=pdf.numPages;n++){
      const page=await pdf.getPage(n);
      const base=page.getViewport({scale:1});
      const targetWidth=Math.min(1180,Math.max(320,window.innerWidth-24));
      const dpr=Math.min(window.devicePixelRatio||1,2);
      const viewport=page.getViewport({scale:(targetWidth/base.width)*dpr});

      const section=document.createElement("section");
      section.className="page";
      section.setAttribute("aria-label","Página "+n);

      const canvas=document.createElement("canvas");
      canvas.width=Math.floor(viewport.width);
      canvas.height=Math.floor(viewport.height);
      canvas.style.width=Math.floor(viewport.width/dpr)+"px";
      canvas.style.height=Math.floor(viewport.height/dpr)+"px";

      section.appendChild(canvas);
      catalog.appendChild(section);

      await page.render({
        canvasContext:canvas.getContext("2d",{alpha:false}),
        viewport
      }).promise;
    }
  }

  renderCatalog().catch((err)=>{
    console.error(err);
    status.textContent="No se pudo cargar el catálogo. Actualiza la página e inténtalo nuevamente.";
  });

  document.addEventListener("contextmenu",(e)=>e.preventDefault());
</script>
</body>
</html>
